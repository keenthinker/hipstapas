    <style>
        :root, [data-bs-theme="light"] {
            --bs-body-bg: #fafafa;
            --bs-body-color: #1a1a1a;
            --bs-primary: rgb(62, 77, 218);
            --accent-gradient: linear-gradient(135deg, rgb(62, 77, 218), #9d4edd);
            --card-bg: #ffffff;
            --card-border: rgba(0, 0, 0, 0.06);
            --nav-bg: rgba(250, 250, 250, 0.8);
            --code-bg: rgba(62, 77, 218, 0.06);
        }

        [data-bs-theme="dark"] {
            --bs-body-bg: #0b0c10;
            --bs-body-color: #f5f5f7;
            --bs-primary: rgb(110, 123, 255);
            --accent-gradient: linear-gradient(135deg, rgb(110, 123, 255), #c77dff);
            --card-bg: #13151a;
            --card-border: rgba(255, 255, 255, 0.05);
            --nav-bg: rgba(11, 12, 16, 0.8);
            --code-bg: rgba(110, 123, 255, 0.12);
        }

        body {
            font-family: 'Roboto Mono', monospace;
            font-size: 1rem;
            letter-spacing: -0.02em;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .navbar-slick {
            background: var(--nav-bg) !important;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--card-border);
            transition: all 0.3s ease;
        }

        .redunderline {
            position: relative;
            white-space: nowrap;
        }
        .redunderline::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: -2px;
            width: 100%;
            height: 3px;
            background: #ff0000;
            border-radius: 2px;
        }

        .slick-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.01);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .slick-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(62, 77, 218, 0.04);
        }

        .text-gradient {
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        main {
            flex: 1;
            padding-top: 5.5rem;
        }

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <script>
        function setTextForId(id, v) {
            document.getElementById(id).textContent = v;
        }

        function rangeMinLengthChange(v) {
            setTextForId('minLengthRangeValue', v);
        }
        function rangeMaxLengthChange(v) {
            setTextForId('maxLengthRangeValue', v);
        }
        function resultsCountChange(v) {
            setTextForId('resultsCountRangeValue', v);
        }
        function resultsCountChangeUuid(v) {
            setTextForId('resultsCountRangeValueUuid', v);
        }
        function resultsCountChangeWordList(v) {
            setTextForId('resultsCountRangeValueWordList', v);
        }
        function wordsCountChangeWordList(v) {
            setTextForId('wordsCountRangeValueWordList', v);
        }
        function minChangeRandomNumber(v) {
            setTextForId('minRangeValueRandomNumber', v); 
        }
        function maxChangeRandomNumber(v) {
            setTextForId('maxRangeValueRandomNumber', v); 
        }
        function resultsCountChangeRandomNumber(v) {
            setTextForId('resultsCountRangeValueRandomNumber', v);
        }

        document.addEventListener("DOMContentLoaded", () => {
            console.log("Ready to rumble! 🚀");
            bindThemeSwitcher();

            // show default range values on load
            rangeMinLengthChange(10);
            rangeMaxLengthChange(30);
            resultsCountChange(1);
            resultsCountChangeUuid(1);
            resultsCountChangeWordList(1);
            wordsCountChangeWordList(6);
            minChangeRandomNumber(1);
            maxChangeRandomNumber(100);
            resultsCountChangeRandomNumber(1);

            document.getElementById('generate').addEventListener('click', () => {
                let includeSmallCharacters = document.getElementById('checkSmallCharacters').checked;
                let includeCapitalCharacters = document.getElementById('checkCapitalCharacters').checked;
                let includeNumbers = document.getElementById('checkNumbers').checked;
                let includeSpecialCharacters = document.getElementById('checkSpecialCharacters').checked;
                let lengthMin = Number(document.getElementById('minLengthRangeValue').textContent);
                let lengthMax = Number(document.getElementById('maxLengthRangeValue').textContent);
                let resultsCount = Number(document.getElementById('resultsCountRangeValue').textContent);

                let queryPassword = `/api/?lengthMin=${lengthMin}&lengthMax=${lengthMax}&resultsCount=${resultsCount}&alphabetSmall=${includeSmallCharacters}&alphabetCapital=${includeCapitalCharacters}&alphabetNumber=${includeNumbers}&alphabetSpecial=${includeSpecialCharacters}`;
                
                console.log(queryPassword);

                fetch(queryPassword)
                .then(function(res){
                    return res.text();
                })
                .then(function(data) {
                    console.log(data);
                    document.getElementById('chbs').value = data;
                    document.getElementById('chbsQuery').value = 'https://hipstapas.dev' + queryPassword;
                })
                .catch(function(err) { console.error(err);});
            });

            document.getElementById('generateUuid').addEventListener('click', () => {
                let resultsCount = Number(document.getElementById('resultsCountRangeValueUuid').textContent);
                let queryUuid = `/api/uuid?resultsCount=${resultsCount}`;
                
                console.log(queryUuid);

                fetch(queryUuid)
                .then(function(res){
                    return res.text();
                })
                .then(function(data) {
                    console.log(data);
                    document.getElementById('uuidOutput').value = data;
                    document.getElementById('uuidQuery').value = 'https://hipstapas.dev' + queryUuid;
                })
                .catch(function(err) { console.error(err);});
            });

            document.getElementById('generateWordList').addEventListener('click', () => {
                let wordsCount = Number(document.getElementById('wordsCountRangeValueWordList').textContent);
                let resultsCount = Number(document.getElementById('resultsCountRangeValueWordList').textContent);
                let queryWordList = `/api/wordlist?words=${wordsCount}&resultsCount=${resultsCount}`;
                
                console.log(queryWordList);

                fetch(queryWordList)
                .then(function(res){
                    return res.text();
                })
                .then(function(data) {
                    console.log(data);
                    document.getElementById('wordListOutput').value = data;
                    document.getElementById('wordListQuery').value = 'https://hipstapas.dev' + queryWordList;
                })
                .catch(function(err) { console.error(err);});
            });

            document.getElementById('generateRandomNumber').addEventListener('click', () => {
                let min = Number(document.getElementById('minRangeValueRandomNumber').textContent);
                let max = Number(document.getElementById('maxRangeValueRandomNumber').textContent);
                let resultsCount = Number(document.getElementById('resultsCountRangeValueRandomNumber').textContent);
                let sort = document.getElementById('checkSortRandomNumber').checked;
                let noDuplicates = document.getElementById('checkNoDuplicatesRandomNumber').checked;
                let queryRandomNumber = `/api/random?min=${min}&max=${max}&sort=${sort}&noDuplicates=${noDuplicates}&resultsCount=${resultsCount}`;
                
                console.log(queryRandomNumber);

                fetch(queryRandomNumber)
                .then(function(res){
                    return res.text();
                })
                .then(function(data) {
                    console.log(data);
                    document.getElementById('randomNumberOutput').value = data;
                    document.getElementById('randomNumberQuery').value = 'https://hipstapas.dev' + queryRandomNumber;
                })
                .catch(function(err) { console.error(err);});
            });
        });
    </script>
</head>
<body class="d-flex flex-column h-100">

  <main class="flex-shrink-0">
    <section class="py-5 my-md-4">
      <div class="container">
        <div class="row align-items-center g-5">
          <div class="col-md-7">
            <h1 class="display-5 fw-bold mb-3 tracking-tight text-body">
              Welcome to the hipstapas<span class="text-danger">.</span>dev <span class="text-gradient">playground.</span>
            </h1>
            <p class="fs-5 text-muted fw-light mb-0">Explore the API features and see the result instantly without writing any code.</p>
          </div>
          <div class="col-md-5">
            <div class="p-4 slick-card bg-opacity-50 text-center">
              <img class="img-fluid mx-auto d-block" style="max-height: 220px; filter: drop-shadow(0px 10px 20px rgba(0,0,0,0.05));" src="images/undraw_control_panel1_20gm.svg" alt="image of a mix pult">
            </div>
          </div>
        </div>
      </div>
    </section>

    <section class="pb-5 mb-4">
      <div class="container">
        <!-- Password -->
        <div class="slick-card p-4 p-md-5 mb-4">
          <h2 class="h4 fw-bold mb-4 text-body"><span class="redunderline">Password</span></h2>

          <div class="mb-3">
            <label for="chbs" class="form-label fw-bold">Output</label>
            <textarea class="form-control" readonly id="chbs" rows="2"></textarea>
          </div>

          <div class="d-grid mb-4">
            <button id="generate" class="btn btn-primary btn-lg" type="button">Generate</button>
          </div>

          <div class="mb-3">
            <label for="rangeMinLength" class="form-label">Length (min): <span id="minLengthRangeValue" class="fw-bold text-primary"></span></label>
            <input 
              type="range" 
              min="1"
              max="100"
              step="1"
              value="10"
              class="form-range" 
              id="rangeMinLength" 
              oninput="rangeMinLengthChange(value)"
              onchange="rangeMinLengthChange(value)">
          </div>

          <div class="mb-3">
            <label for="rangeMaxLength" class="form-label">Length (max): <span id="maxLengthRangeValue" class="fw-bold text-primary"></span></label>
            <input 
              type="range" 
              min="1"
              max="100"
              step="1"
              value="30"
              class="form-range" 
              id="rangeMaxLength" 
              oninput="rangeMaxLengthChange(value)"
              onchange="rangeMaxLengthChange(value)">
          </div>

          <div class="mb-4">
            <label for="rangeResultsCount" class="form-label">Number of results: <span id="resultsCountRangeValue" class="fw-bold text-primary"></span></label>
            <input 
              type="range" 
              min="1"
              max="10"
              step="1"
              value="1"
              class="form-range" 
              id="rangeResultsCount" 
              oninput="resultsCountChange(value)"
              onchange="resultsCountChange(value)">
          </div>

          <div class="mb-4">
            <div class="form-check form-switch mb-2">
              <input class="form-check-input" type="checkbox" role="switch" id="checkSmallCharacters" checked>
              <label class="form-check-label" for="checkSmallCharacters">
                include small characters <span class="badge bg-secondary bg-opacity-10 text-body border ms-1">abcdefghijklmnopqrstuvwxyz</span>
              </label>
            </div>
            <div class="form-check form-switch mb-2">
              <input class="form-check-input" type="checkbox" role="switch" id="checkCapitalCharacters" checked>
              <label class="form-check-label" for="checkCapitalCharacters">
                include capital characters <span class="badge bg-secondary bg-opacity-10 text-body border ms-1">ABCDEFGHIJKLMNOPQRSTUVWXYZ</span>
              </label>
            </div>
            <div class="form-check form-switch mb-2">
              <input class="form-check-input" type="checkbox" role="switch" id="checkNumbers" checked>
              <label class="form-check-label" for="checkNumbers">
                include numbers <span class="badge bg-secondary bg-opacity-10 text-body border ms-1">0123456789</span>
              </label>
            </div>
            <div class="form-check form-switch">
              <input class="form-check-input" type="checkbox" role="switch" id="checkSpecialCharacters">
              <label class="form-check-label" for="checkSpecialCharacters">
                include special characters <span class="badge bg-secondary bg-opacity-10 text-body border ms-1">.,+-*/!?;:{}()[]%$&amp;~#@|</span>
              </label>
            </div>
          </div>

          <div>
            <label for="chbsQuery" class="form-label fw-bold">Query</label>
            <textarea class="form-control" readonly id="chbsQuery" rows="2"></textarea>
          </div>
        </div>

        <!-- UUID -->
        <div class="slick-card p-4 p-md-5 mb-4">
          <h2 class="h4 fw-bold mb-4 text-body"><span class="redunderline">UUID</span></h2>

          <div class="mb-3">
            <label for="uuidOutput" class="form-label fw-bold">Output</label>
            <textarea class="form-control" readonly id="uuidOutput" rows="2"></textarea>
          </div>

          <div class="d-grid mb-4">
            <button id="generateUuid" class="btn btn-primary btn-lg" type="button">Generate</button>
          </div>

          <div class="mb-4">
            <label for="rangeResultsCountUuid" class="form-label">Number of results: <span id="resultsCountRangeValueUuid" class="fw-bold text-primary"></span></label>
            <input 
              type="range" 
              min="1"
              max="10"
              step="1"
              value="1"
              class="form-range" 
              id="rangeResultsCountUuid" 
              oninput="resultsCountChangeUuid(value)"
              onchange="resultsCountChangeUuid(value)">
          </div>

          <div>
            <label for="uuidQuery" class="form-label fw-bold">Query</label>
            <textarea class="form-control" readonly id="uuidQuery" rows="2"></textarea>
          </div>
        </div>

        <!-- EFF word list -->
        <div class="slick-card p-4 p-md-5 mb-4">
          <h2 class="h4 fw-bold mb-4 text-body"><span class="redunderline">EFF word list</span></h2>

          <div class="mb-3">
            <label for="wordListOutput" class="form-label fw-bold">Output</label>
            <textarea class="form-control" readonly id="wordListOutput" rows="2"></textarea>
          </div>

          <div class="d-grid mb-4">
            <button id="generateWordList" class="btn btn-primary btn-lg" type="button">Generate</button>
          </div>

          <div class="mb-3">
            <label for="rangeWordsCountWordList" class="form-label">Number of words: <span id="wordsCountRangeValueWordList" class="fw-bold text-primary"></span></label>
            <input 
              type="range" 
              min="1"
              max="10"
              step="1"
              value="6"
              class="form-range" 
              id="rangeWordsCountWordList" 
              oninput="wordsCountChangeWordList(value)"
              onchange="wordsCountChangeWordList(value)">
          </div>

          <div class="mb-4">
            <label for="rangeResultsCountWordList" class="form-label">Number of results: <span id="resultsCountRangeValueWordList" class="fw-bold text-primary"></span></label>
            <input 
              type="range" 
              min="1"
              max="10"
              step="1"
              value="1"
              class="form-range" 
              id="rangeResultsCountWordList" 
              oninput="resultsCountChangeWordList(value)"
              onchange="resultsCountChangeWordList(value)">
          </div>

          <div>
            <label for="wordListQuery" class="form-label fw-bold">Query</label>
            <textarea class="form-control" readonly id="wordListQuery" rows="2"></textarea>
          </div>
        </div>

        <!-- Random number -->
        <div class="slick-card p-4 p-md-5">
          <h2 class="h4 fw-bold mb-4 text-body"><span class="redunderline">Random number</span></h2>

          <div class="mb-3">
            <label for="randomNumberOutput" class="form-label fw-bold">Output</label>
            <textarea class="form-control" readonly id="randomNumberOutput" rows="2"></textarea>
          </div>

          <div class="d-grid mb-4">
            <button id="generateRandomNumber" class="btn btn-primary btn-lg" type="button">Generate</button>
          </div>

          <div class="mb-3">
            <label for="rangeMinRandomNumber" class="form-label">Min: <span id="minRangeValueRandomNumber" class="fw-bold text-primary"></span></label>
            <input 
              type="range" 
              min="1"
              max="100"
              step="1"
              value="1"
              class="form-range" 
              id="rangeMinRandomNumber" 
              oninput="minChangeRandomNumber(value)"
              onchange="minChangeRandomNumber(value)">
          </div>

          <div class="mb-3">
            <label for="rangeMaxRandomNumber" class="form-label">Max: <span id="maxRangeValueRandomNumber" class="fw-bold text-primary"></span></label>
            <input 
              type="range" 
              min="1"
              max="100"
              step="1"
              value="100"
              class="form-range" 
              id="rangeMaxRandomNumber" 
              oninput="maxChangeRandomNumber(value)"
              onchange="maxChangeRandomNumber(value)">
          </div>

          <div class="mb-4">
            <label for="rangeResultsCountRandomNumber" class="form-label">Number of results: <span id="resultsCountRangeValueRandomNumber" class="fw-bold text-primary"></span></label>
            <input 
              type="range" 
              min="1"
              max="10"
              step="1"
              value="1"
              class="form-range" 
              id="rangeResultsCountRandomNumber" 
              oninput="resultsCountChangeRandomNumber(value)"
              onchange="resultsCountChangeRandomNumber(value)">
          </div>

          <div class="mb-4">
            <div class="form-check form-switch mb-2">
              <input class="form-check-input" type="checkbox" role="switch" id="checkSortRandomNumber">
              <label class="form-check-label" for="checkSortRandomNumber">sort number sequence</label>
            </div>
            <div class="form-check form-switch">
              <input class="form-check-input" type="checkbox" role="switch" id="checkNoDuplicatesRandomNumber">
              <label class="form-check-label" for="checkNoDuplicatesRandomNumber">no duplicates in number sequence</label>
            </div>
          </div>

          <div>
            <label for="randomNumberQuery" class="form-label fw-bold">Query</label>
            <textarea class="form-control" readonly id="randomNumberQuery" rows="2"></textarea>
          </div>
        </div>
      </div>
    </section>
  </main>
