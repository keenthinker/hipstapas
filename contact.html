    <style>
        :root, [data-bs-theme="light"] {
            --bs-body-bg: #fafafa;

            --bs-primary: rgb(62, 77, 218);
            --accent-gradient: linear-gradient(135deg, rgb(62, 77, 218), #9d4edd);
            --card-bg: #ffffff;
            --card-border: rgba(0, 0, 0, 0.06);
            --nav-bg: rgba(250, 250, 250, 0.8);
        }

        [data-bs-theme="dark"] {
            --bs-body-bg: #0b0c10;
            --bs-body-color: #f5f5f7;
            --bs-primary: rgb(110, 123, 255);
            --accent-gradient: linear-gradient(135deg, rgb(110, 123, 255), #c77dff);
            --card-bg: #13151a;
            --card-border: rgba(255, 255, 255, 0.05);
            --nav-bg: rgba(11, 12, 16, 0.8);
        }

        body {
            font-family: 'Roboto Mono', monospace;
            font-size: 1rem;
            letter-spacing: -0.02em;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .navbar-slick {
            background: var(--nav-bg) !important;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--card-border);
            transition: all 0.3s ease;
        }

        .redunderline {
            position: relative;
            white-space: nowrap;
        }
        .redunderline::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: -2px;
            width: 100%;
            height: 3px;
            background: #ff0000;
            border-radius: 2px;
        }

        .slick-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.01);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .slick-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(62, 77, 218, 0.04);
        }

        .text-gradient {
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        main {
            flex: 1;
            padding-top: 5.5rem;
        }
    </style>
